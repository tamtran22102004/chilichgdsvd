<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Lịch nấu ăn & rửa chén</title>

  <!-- Thư viện exceljs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.2.1/exceljs.min.js"></script>

  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 40px;
      color: #333;
    }
    h1, h2 {
      text-align: center;
      color: #1f2937;
    }
    .container {
      max-width: 1200px;
      margin: auto;
    }
    button {
      display: inline-block;
      margin: 20px 10px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #2563eb;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 30px 0;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      background-color: white;
    }
    th, td {
      border: 1px solid #e5e7eb;
      padding: 15px;
      text-align: center;
      font-size: 16px; /* Tăng kích thước chữ */
    }
    th {
      background-color: #80c9c1; /* Màu nền của tiêu đề */
      color: white;
    }
    td.job-title {
      font-weight: bold;
      background-color: #fef3c7; /* Màu nền cho công việc */
    }
    .member-editor {
      margin: 40px 0 20px;
    }
    .member-editor textarea {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .button-group {
      text-align: center;
    }
  </style>
</head>
<body>
<div class="container">

  <!-- Phần chỉnh sửa danh sách người dùng -->
  <div class="member-editor">
    <h2>Danh sách người dùng</h2>
    <textarea id="member-input" rows="4">Jos Thịnh, Anh Duy, Toàn, Quốc Duy, Đạt, Hiếu, Phương, Đăng, Tuân, Huy, Cá, Khoa, Tâm, Vũ, Tú, Quý, Tiến, Thịnh, Kiệt, Thuận, Son, Chương, Văn Trường</textarea>
  </div>

  <div class="button-group">
    <button onclick="updateMembers(); generateSchedule()">Tạo Lịch Mới</button>
    <button onclick="exportToExcel()">Xuất Excel</button>
  </div>

  <h1>Lịch nấu ăn & rửa chén</h1>

  <table id="schedule-table">
    <thead>
      <tr>
        <th>Công việc</th>
        <th>Thứ 2</th>
        <th>Thứ 3</th>
        <th>Thứ 4</th>
        <th>Thứ 5</th>
        <th>Thứ 6</th>
        <th>Thứ 7</th>
        <th>Chủ nhật</th>
      </tr>
    </thead>
    <tbody id="schedule-body"></tbody>
  </table>

  <h2>Thống kê số lượt làm</h2>
  <table id="stats-table">
    <thead>
      <tr>
        <th>Người dùng</th>
        <th>Số lần nấu ăn</th>
        <th>Số lần rửa chén</th>
      </tr>
    </thead>
    <tbody id="stats-body"></tbody>
  </table>
</div>

<script>
let members = [];
let schedule = {};
let stats = {};

function updateMembers() {
  const input = document.getElementById('member-input').value;
  members = input.split(',')
    .map(name => name.trim())
    .filter(name => name.length > 0);
}

const days = ['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'Chủ nhật'];
const jobs = [
  { label: 'Nấu sáng + Rửa trưa', types: ['cook', 'wash'] },
  { label: 'Nấu chiều + Rửa tối', types: ['cook', 'wash'] }
];

function shuffleArray(array) {
  const arr = array.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function generateSchedule() {
  if (members.length === 0) {
    alert('Danh sách người dùng đang trống!');
    return;
  }

  schedule = {};
  stats = {};
  members.forEach(name => stats[name] = { cook: 0, wash: 0 });

  let queue = shuffleArray(members);
  let index = 0;
  const assignUser = () => {
    if (index >= queue.length) index = 0;
    return queue[index++];
  };

  const allJobs = [];
  days.forEach(day => {
    jobs.forEach(job => allJobs.push({ day, job }));
  });

  queue = shuffleArray(members);
  index = 0;

  allJobs.forEach(({ day, job }) => {
    if (!schedule[day]) schedule[day] = {};
    const assigned = [assignUser(), assignUser()];
    schedule[day][job.label] = assigned;

    assigned.forEach(name => {
      job.types.forEach(type => stats[name][type]++);
    });
  });

  // Hiển thị lịch trực
  const scheduleBody = document.getElementById('schedule-body');
  scheduleBody.innerHTML = '';
  jobs.forEach(job => {
    const row = document.createElement('tr');
    const jobCell = document.createElement('td');
    jobCell.textContent = job.label;
    jobCell.classList.add('job-title');
    row.appendChild(jobCell);

    days.forEach(day => {
      const cell = document.createElement('td');
      const names = schedule[day][job.label] || [];
      cell.innerHTML = names.join('<br>');
      row.appendChild(cell);
    });

    scheduleBody.appendChild(row);
  });

  // Hiển thị thống kê
  const statsBody = document.getElementById('stats-body');
  statsBody.innerHTML = '';
  members.forEach(name => {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${name}</td>
      <td>${stats[name].cook}</td>
      <td>${stats[name].wash}</td>
    `;
    statsBody.appendChild(row);
  });
}

function exportToExcel() {
  const wb = new ExcelJS.Workbook();
  const sheet = wb.addWorksheet('Lịch trực & Thống kê');

  // Tiêu đề chính
  sheet.mergeCells('A1:H1');
  const titleCell = sheet.getCell('A1');
  titleCell.value = 'LỊCH CÔNG TÁC NẤU ĂN RỬA CHÉN';
  titleCell.font = { bold: true, size: 14 };
  titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
  titleCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'C6EFCE' } }; // xanh lá nhạt
  titleCell.border = {
    top: { style: 'thin', color: { argb: '000000' } },
    left: { style: 'thin', color: { argb: '000000' } },
    bottom: { style: 'thin', color: { argb: '000000' } },
    right: { style: 'thin', color: { argb: '000000' } }
  };

  let currentRow = 2;

  // Header bảng lịch trực
  const headerRow = sheet.getRow(currentRow++);
  headerRow.values = ['Công việc', ...days];
  headerRow.eachCell(cell => {
    cell.font = { bold: true, size: 11 };
    cell.alignment = { horizontal: 'center', vertical: 'middle' };
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFCCCC' } };
    cell.border = {
      top: { style: 'thin', color: { argb: '000000' } },
      left: { style: 'thin', color: { argb: '000000' } },
      bottom: { style: 'thin', color: { argb: '000000' } },
      right: { style: 'thin', color: { argb: '000000' } }
    };
  });

  // Nội dung bảng lịch trực
  jobs.forEach(job => {
    const row = sheet.getRow(currentRow++);
    const rowData = [job.label];
    days.forEach(day => {
      const names = schedule[day][job.label] || [];
      rowData.push(names.join(', '));
    });
    row.values = rowData;
    row.eachCell(cell => {
      cell.font = { size: 10 };
      cell.alignment = { vertical: 'middle', wrapText: true };
      cell.border = {
        top: { style: 'thin', color: { argb: '000000' } },
        left: { style: 'thin', color: { argb: '000000' } },
        bottom: { style: 'thin', color: { argb: '000000' } },
        right: { style: 'thin', color: { argb: '000000' } }
      };
    });
  });

  // Chèn dòng trống
  currentRow += 2;

  // Tiêu đề phần thống kê
  const statTitle = sheet.getRow(currentRow++);
  statTitle.values = ['Thống kê tổng hợp'];
  sheet.mergeCells(`A${statTitle.number}:C${statTitle.number}`);
  statTitle.getCell(1).font = { bold: true, size: 12 };
  statTitle.getCell(1).alignment = { horizontal: 'left' };

  // Header thống kê
  const statHeader = sheet.getRow(currentRow++);
  statHeader.values = ['Người dùng', 'Số lần nấu ăn', 'Số lần rửa chén'];
  statHeader.eachCell(cell => {
    cell.font = { bold: true, size: 11 };
    cell.alignment = { horizontal: 'center', vertical: 'middle' };
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFCCCC' } };
    cell.border = {
      top: { style: 'thin', color: { argb: '000000' } },
      left: { style: 'thin', color: { argb: '000000' } },
      bottom: { style: 'thin', color: { argb: '000000' } },
      right: { style: 'thin', color: { argb: '000000' } }
    };
  });

  // Dữ liệu thống kê
  members.forEach(name => {
    const row = sheet.getRow(currentRow++);
    row.values = [name, stats[name].cook, stats[name].wash];
    row.eachCell(cell => {
      cell.font = { size: 10 };
      cell.alignment = { horizontal: 'center', vertical: 'middle' };
      cell.border = {
        top: { style: 'thin', color: { argb: '000000' } },
        left: { style: 'thin', color: { argb: '000000' } },
        bottom: { style: 'thin', color: { argb: '000000' } },
        right: { style: 'thin', color: { argb: '000000' } }
      };
    });
  });

  // Căn chỉnh cột chung
  sheet.columns = [
    { width: 20 },
    { width: 20 },
    { width: 20 },
    { width: 20 },
    { width: 20 },
    { width: 20 },
    { width: 20 },
    { width: 20 }
  ];

  // Xuất file
  wb.xlsx.writeBuffer().then((buffer) => {
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'lich-cong-tac-nau-an.xlsx';
    a.click();
  });
}



// Khởi tạo mặc định
updateMembers();
generateSchedule();
</script>

</body>
</html>
